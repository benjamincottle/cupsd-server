# cupsd.conf for the cupsd-server image: Debian's default, changed only where
# a container on a home LAN needs it (marked "Changed").
#
# If /etc/cups is mounted and already contains a cupsd.conf, that file is used
# and this one is ignored. The entrypoint only copies this in when it's missing.

LogLevel warn
PageLogFormat
MaxLogSize 0
ErrorPolicy retry-job

# Changed: listen on every interface. Inside a container, clients connect over
# the Docker network, so Debian's "Listen localhost:631" can't be reached.
Port 631
Listen /run/cups/cups.sock

# Changed: accept any Host header, so the server can be reached by IP address
# or by any hostname the LAN knows it as.
ServerAlias *

# Advertise shared printers over DNS-SD (Bonjour/AirPrint). The container runs
# no avahi-daemon of its own: cupsd publishes through the host's avahi-daemon
# over the host's D-Bus socket, so this only takes effect when /run/dbus is
# mounted from a host that runs avahi-daemon.
Browsing On
BrowseLocalProtocols dnssd
# Changed: printers are shared when they're added.
DefaultShared Yes

DefaultAuthType Basic
WebInterface Yes

# Changed: allow the private IPv4 ranges. "Allow @LOCAL" doesn't work here,
# because inside a container it means the Docker network rather than your LAN.
# 172.16.0.0/12 also covers Docker's own networks, which connections arrive
# from when Docker proxies the published port.
<Location />
  Order allow,deny
  Allow from 127.0.0.1
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>

# The admin pages additionally need a login as a member of the lpadmin group
# (@SYSTEM): the image's "admin" user, whose password the entrypoint sets.
<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 127.0.0.1
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 127.0.0.1
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>

<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 127.0.0.1
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>

# Debian's default operation policy, unchanged. (Debian's "authenticated" and
# "kerberos" policies are left out; no printer here uses them.)
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Get-Document>
    AuthType Default
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Authenticate-Job>
    AuthType Default
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>

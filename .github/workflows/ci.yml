name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Workflow syntax errors are caught on the PR
  # rather than after they have already landed on main.
  lint-workflows:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      # Exits non-zero on any finding; also runs shellcheck on run: scripts.
      - name: actionlint
        run: ./actionlint -color

  # Dockerfile best-practice checks. Accepted findings, each with its reason,
  # live in .hadolint.yaml so a local `hadolint Dockerfile` matches CI.
  lint-dockerfile:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The official release binary, checked against its published checksum.
      # Dependabot can't bump this: update the version and checksum by hand
      # from the release's checksums.sha256.
      - name: Install hadolint
        env:
          HADOLINT_VERSION: 2.15.1
          HADOLINT_SHA256: f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d
        run: |
          curl -sSfL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-arm64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint

      # Exits non-zero on any finding not ignored in .hadolint.yaml.
      - name: hadolint
        run: ./hadolint Dockerfile

      # hadolint only checks the shell inside RUN; the entrypoint script is
      # checked separately. shellcheck is preinstalled on the runner.
      - name: shellcheck entrypoint.sh
        run: shellcheck entrypoint.sh

  # build.yml only runs on main, so without this a broken Dockerfile is not
  # discovered until after the merge. Skipped only on a main push, where
  # build.yml does the real build and running both would build it twice;
  # pull_request and workflow_dispatch both still validate it.
  docker-build:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # load: true puts the image into the runner's Docker so the next step
      # can start it.
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: cupsd-server:ci

      # The entrypoint must refuse to start without an admin password rather
      # than fall back to a default one. timeout catches a container that
      # starts anyway (exit 124) instead of letting the job hang.
      - name: Check it refuses to start without a password
        run: |
          rc=0
          timeout 20 docker run --rm --name cupsd-nopw cupsd-server:ci || rc=$?
          docker rm -f cupsd-nopw >/dev/null 2>&1 || true
          if [ "$rc" -ne 1 ]; then
            echo "expected exit 1 without a password, got $rc"
            exit 1
          fi

      # A successful build doesn't prove cupsd works with the image's config,
      # so start it the way it's deployed and check it from outside.
      - name: Check cupsd works
        env:
          PASSWORD: ci-test-password
        run: |
          docker run -d --name cupsd -p 127.0.0.1:631:631 \
            -e CUPS_ADMIN_PASSWORD="$PASSWORD" cupsd-server:ci

          fail() {
            echo "FAILED: $1"
            docker logs cupsd
            exit 1
          }
          # Prints the HTTP status for a URL on the published port.
          status() {
            curl -s -o /dev/null -w '%{http_code}' "$@"
          }

          for _ in $(seq 1 30); do
            if docker exec cupsd lpstat -r 2>/dev/null | grep -q 'scheduler is running'; then
              break
            fi
            sleep 1
          done
          docker exec cupsd lpstat -r | grep -q 'scheduler is running' \
            || fail "cupsd did not report running within 30s"
          echo "ok: cupsd is running"

          [ "$(status http://127.0.0.1:631/)" = 200 ] \
            || fail "web interface not reachable through the published port"
          echo "ok: reachable through the published port"

          # Over plain HTTP, CUPS answers 426 so the browser switches to HTTPS
          # (a self-signed certificate CUPS generates) before sending the
          # password. The login itself is checked over HTTPS.
          [ "$(status http://127.0.0.1:631/admin/)" = 426 ] \
            || fail "admin pages over HTTP aren't upgraded to HTTPS"
          echo "ok: admin pages over HTTP are upgraded to HTTPS"

          [ "$(status -k https://127.0.0.1:631/admin/)" = 401 ] \
            || fail "admin pages don't ask for a login"
          echo "ok: admin pages ask for a login"

          [ "$(status -k -u admin:wrong-password https://127.0.0.1:631/admin/)" = 401 ] \
            || fail "admin login accepted a wrong password"
          echo "ok: a wrong admin password is rejected"

          [ "$(status -k -u "admin:$PASSWORD" https://127.0.0.1:631/admin/)" = 200 ] \
            || fail "admin login with the configured password was rejected"
          echo "ok: admin login works with the configured password"

          docker exec cupsd lpinfo -m | grep -q 'Brother HL-2030 Foomatic/hl1250' \
            || fail "the Brother HL-2030 hl1250 driver is missing"
          echo "ok: Brother HL-2030 Foomatic/hl1250 driver is available"
